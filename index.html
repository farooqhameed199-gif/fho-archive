<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FHO Premium Course Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
            background-image: radial-gradient(at 0% 0%, hsla(160, 100%, 74%, 0.3) 0px, transparent 50%), radial-gradient(at 100% 0%, hsla(190, 100%, 76%, 0.4) 0px, transparent 50%), radial-gradient(at 100% 100%, hsla(240, 100%, 82%, 0.3) 0px, transparent 50%);
            background-attachment: fixed;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04);
            transition: transform 0.3s ease;
        }
        .glass-card:hover { transform: translateY(-5px); box-shadow: 0 30px 60px rgba(0, 168, 132, 0.1); }
        .btn-gradient { background: linear-gradient(135deg, #059669, #0d9488); }
        .btn-gradient:hover { box-shadow: 0 10px 20px -5px rgba(5, 150, 105, 0.5); }
    </style>
</head>
<body class="min-h-screen text-gray-800 flex flex-col">

    <header class="bg-white/60 backdrop-blur-xl border-b border-white/80 sticky top-0 z-50 shadow-sm p-4">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-gradient-to-tr from-emerald-500 to-teal-500 rounded-xl flex justify-center items-center text-white text-xl shadow-lg">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight">FHO Course Vault</h1>
                    <p class="text-xs text-emerald-600 font-bold"><i class="fa-solid fa-circle-check"></i> Live Sync Active</p>
                </div>
            </div>
            <div class="w-full md:w-96 relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="searchInput" placeholder="Search courses..." class="w-full pl-10 pr-4 py-3 rounded-full bg-white/50 border border-white/80 focus:bg-white focus:outline-none focus:ring-2 ring-emerald-500 transition-all text-sm">
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-4xl mx-auto w-full p-4 md:p-8 pb-20">
        <div id="course-container" class="space-y-6">
            <p class="text-center text-gray-500 font-bold mt-10"><i class="fa-solid fa-spinner fa-spin"></i> Syncing with FHO Servers...</p>
        </div>
    </main>

    <a href="https://heylink.me/FarooqHameedOfficial" class="fixed bottom-8 right-8 w-14 h-14 bg-gradient-to-tr from-green-500 to-emerald-600 text-white rounded-full flex items-center justify-center text-3xl shadow-[0_10px_25px_rgba(16,185,129,0.5)] hover:scale-110 transition-transform z-50"><i class="fa-brands fa-whatsapp"></i></a>

    <script>
        let courses = [];
        
        async function loadCourses() {
            try {
                // Fetch directly from your GitHub repo!
                const res = await fetch('archive.json?' + new Date().getTime());
                if (!res.ok) throw new Error('Not found');
                courses = await res.json();
                renderCourses(courses);
            } catch (e) {
                document.getElementById('course-container').innerHTML = `<p class="text-center text-gray-500 font-bold mt-10">Waiting for the bot to push the first course...</p>`;
            }
        }

        function renderCourses(data) {
            const container = document.getElementById('course-container');
            if(data.length === 0) return container.innerHTML = `<p class="text-center text-gray-500">No courses found.</p>`;
            
            let html = '';
            data.forEach(course => {
                html += `
                <div class="glass-card p-6 md:p-8">
                    <div class="flex justify-between items-center mb-4 border-b border-gray-200/50 pb-4">
                        <span class="text-xs font-bold text-gray-500"><i class="fa-solid fa-calendar-days"></i> ${course.date}</span>
                        <span class="text-[10px] uppercase font-bold tracking-wider bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full"><i class="fa-solid fa-tag"></i> ${course.category}</span>
                    </div>
                    <h2 class="text-xl md:text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-teal-700 to-emerald-600 mb-4">${course.title}</h2>
                    <div class="bg-white/50 p-4 rounded-xl border border-white mb-6 text-sm text-gray-600 font-medium">
                        <p class="mb-2"><i class="fa-solid fa-check text-emerald-500"></i> High-Quality Video Modules</p>
                        <p><i class="fa-solid fa-check text-emerald-500"></i> FHO Network Certified</p>
                    </div>
                    <a href="${course.link}" target="_blank" class="btn-gradient inline-block text-white font-bold text-sm px-6 py-3 rounded-full uppercase tracking-wide"><i class="fa-solid fa-cloud-arrow-down"></i> Access Course</a>
                </div>`;
            });
            container.innerHTML = html;
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = courses.filter(c => c.title.toLowerCase().includes(term) || c.category.toLowerCase().includes(term));
            renderCourses(filtered);
        });

        loadCourses();
    </script>
</body>
</html>
